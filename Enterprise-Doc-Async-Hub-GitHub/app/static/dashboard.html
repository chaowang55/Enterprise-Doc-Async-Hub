<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合同信息核验 Agent</title>
<style>
body{font:16px system-ui;background:#f3f6f9;color:#193448;max-width:940px;margin:40px auto;padding:20px}main{background:white;padding:32px;border-radius:18px}h1{font-size:30px}h2{font-size:20px;margin-top:32px}p{line-height:1.8;color:#526477}button{background:#126c68;color:white;border:0;padding:12px 24px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{font:inherit;max-width:100%;box-sizing:border-box;margin:8px 0;padding:9px}label{display:block;margin-top:12px}textarea{width:100%}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field,.evidence{padding:16px;background:#f3f6f9;border-radius:10px;margin:12px 0}.field strong{display:block;font-size:20px;margin-top:8px}blockquote{margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f9;padding:16px}summary{cursor:pointer;padding:12px 0}#verdict{font-size:20px;font-weight:bold}#token{display:block;width:300px}
</style></head><body><main><h1>合同信息核验 Agent</h1><p>提取甲方、合同金额和币种，核对原文证据。发现冲突或证据不足时，保留问题并交给人工复核。</p><p id="mode">正在检查服务…</p>
<form id="upload"><label for="token">访问令牌（如已配置）</label><input id="token" type="password" autocomplete="off"><label for="file">选择文档 · TXT / 文本 PDF / DOCX</label><input id="file" type="file" accept=".txt,.pdf,.docx" required><br><button id="submit">上传并核验</button></form><p id="status" role="status" aria-live="polite">等待上传</p>
<section id="findings" hidden><p id="verdict"></p><p id="reasons"></p><div id="fields" class="fields"></div><h2>原文证据</h2><div id="evidence"></div><p id="metrics"></p><details><summary>查看核验记录</summary><pre id="details"></pre></details><h2>人工复核</h2><p>保存处理决定并保留模型原始结果。复核人名称是备注，不代表经过身份认证。</p><form id="review"><label for="reviewer">复核人备注</label><input id="reviewer" required maxlength="80"><label for="decision">处理决定</label><select id="decision"><option value="APPROVE">认可当前结果</option><option value="REJECT">退回处理</option></select><label for="note">复核说明</label><textarea id="note" required maxlength="2000" rows="3"></textarea><button id="save">保存复核记录</button></form><p id="reviewStatus" role="status"></p></section>
</main><script>
const el=id=>document.getElementById(id);let timer,currentTask;
const headers=()=>el('token').value?{Authorization:'Bearer '+el('token').value}:{};
fetch('/health').then(r=>r.json()).then(v=>el('mode').textContent=v.llm_mode==='mock'?'离线演示：仅识别自带示例，结果仍需人工确认。':'已接入真实模型，核验结果请结合原文确认。').catch(()=>el('mode').textContent='服务暂不可用');
const labels={party_a:'甲方名称',contract_amount:'合同金额',currency:'币种'};
function render(t){const r=t.result;if(!r)return;currentTask=t;el('findings').hidden=false;el('verdict').textContent=r.review_status==='SUPPORTED'?'字段有原文支持，请核对后使用':'需要人工复核';el('reasons').textContent=r.review_status==='SUPPORTED'?'证据和格式检查通过，不代表事实准确性的保证。':'存在缺失、冲突、未读内容或预算限制，详情见核验记录。';el('fields').replaceChildren();for(const[key,label]of Object.entries(labels)){const c=document.createElement('div');c.className='field';c.textContent=label;const v=document.createElement('strong');v.textContent=r.fields?.[key]??'尚未确定';c.append(v);el('fields').append(c)}el('evidence').replaceChildren();for(const e of r.evidence??[]){const c=document.createElement('div');c.className='evidence';const h=document.createElement('b');h.textContent=`${labels[e.field]??e.field} · ${e.location??'来源未找到'} · ${e.supported?'有原文支持':'证据未通过校验'}`;const q=document.createElement('blockquote');q.textContent=e.quote;c.append(h,q);el('evidence').append(c)}if(!r.evidence?.length)el('evidence').textContent='尚无可核对的原文证据。';const m=r.metrics??{};el('metrics').textContent=`本次核验用时 ${((m.elapsed_ms??0)/1000).toFixed(2)} 秒 · 模型调用 ${m.model_calls??0} 次 · Token ${m.total_tokens??0}`;el('details').textContent=JSON.stringify(r,null,2)}
async function poll(url){try{const r=await fetch(url,{headers:headers()});if(!r.ok)throw Error('查询失败：'+r.status);const t=await r.json();const s={PENDING:'等待分发',QUEUED:'已排队',PROCESSING:'正在核验',RETRY:'等待重试',SUCCESS:'处理完成',FAILURE:'处理失败'};el('status').textContent=`任务 ${t.id} · ${s[t.status]??t.status} · 已尝试 ${t.attempts} 次`;render(t);if(!['SUCCESS','FAILURE'].includes(t.status)){timer=setTimeout(()=>poll(url),1500)}else{el('submit').disabled=false;if(t.error)el('status').textContent+=' · '+t.error}}catch(e){el('status').textContent=e.message;el('submit').disabled=false}}
el('upload').onsubmit=async e=>{e.preventDefault();clearTimeout(timer);currentTask=null;el('findings').hidden=true;el('reviewStatus').textContent='';el('submit').disabled=true;el('status').textContent='正在上传…';const data=new FormData();data.append('file',el('file').files[0]);try{const r=await fetch('/api/tasks',{method:'POST',headers:headers(),body:data});const t=await r.json();if(!r.ok)throw Error(JSON.stringify(t.detail));el('status').textContent=t.duplicate?'发现重复文档，查询原任务…':'上传成功，等待后台核验…';poll(t.status_url)}catch(e){el('status').textContent=e.message;el('submit').disabled=false}};
el('review').onsubmit=async e=>{e.preventDefault();if(!currentTask)return;el('save').disabled=true;try{const r=await fetch(`/api/tasks/${currentTask.id}/reviews`,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({reviewer_label:el('reviewer').value,decision:el('decision').value,note:el('note').value,task_updated_at:currentTask.updated_at})});if(!r.ok)throw Error('保存失败：'+r.status);const v=await r.json();el('reviewStatus').textContent='复核记录已保存：'+v.id}catch(e){el('reviewStatus').textContent=e.message}finally{el('save').disabled=false}};
</script></body></html>
