[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-doc-async-hub"
version = "0.1.0"
description = "Durable asynchronous contract extraction with FastAPI and Celery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "celery[redis]>=5.5,<6",
  "sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pypdf>=5.4,<7", "python-docx>=1.1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
